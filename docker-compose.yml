services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rustgym
      POSTGRES_PASSWORD: rustgym_dev
      POSTGRES_DB: rustgym
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustgym"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-builder
    environment:
      - SANDBOX_IMAGE=rustgym-sandbox

  # Build-only service that produces the sandbox image used by the runner.
  # This ensures the sandbox image exists before the runner starts.
  # Can also be built manually: docker build -f runner/sandbox.Dockerfile -t rustgym-sandbox ./runner
  sandbox-builder:
    build:
      context: ./runner
      dockerfile: sandbox.Dockerfile
    image: rustgym-sandbox
    entrypoint: ["true"]

volumes:
  pgdata:
  minio-data:
